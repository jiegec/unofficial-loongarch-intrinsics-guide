<text class="t" x="20" y="24" font-weight="700">Wave, lanes and register files</text><rect class="d" x="20" y="50" width="38" height="38" rx="4"/><text class="t" x="30" y="73" font-weight="600">0</text><rect class="d" x="64" y="50" width="38" height="38" rx="4"/><text class="t" x="74" y="73" font-weight="600">1</text><rect class="d" x="108" y="50" width="38" height="38" rx="4"/><text class="t" x="118" y="73" font-weight="600">2</text><rect class="d" x="152" y="50" width="38" height="38" rx="4"/><text class="t" x="162" y="73" font-weight="600">3</text><rect class="d" x="196" y="50" width="38" height="38" rx="4"/><text class="t" x="206" y="73" font-weight="600">4</text><rect class="d" x="240" y="50" width="38" height="38" rx="4"/><text class="t" x="250" y="73" font-weight="600">5</text><rect class="d" x="284" y="50" width="38" height="38" rx="4"/><text class="t" x="294" y="73" font-weight="600">6</text><rect class="d" x="328" y="50" width="38" height="38" rx="4"/><text class="t" x="338" y="73" font-weight="600">7</text><rect class="d" x="20" y="94" width="38" height="38" rx="4"/><text class="t" x="30" y="117" font-weight="600">8</text><rect class="d" x="64" y="94" width="38" height="38" rx="4"/><text class="t" x="74" y="117" font-weight="600">9</text><rect class="d" x="108" y="94" width="38" height="38" rx="4"/><text class="t" x="118" y="117" font-weight="600">10</text><rect class="d" x="152" y="94" width="38" height="38" rx="4"/><text class="t" x="162" y="117" font-weight="600">11</text><rect class="d" x="196" y="94" width="38" height="38" rx="4"/><text class="t" x="206" y="117" font-weight="600">12</text><rect class="d" x="240" y="94" width="38" height="38" rx="4"/><text class="t" x="250" y="117" font-weight="600">13</text><rect class="d" x="284" y="94" width="38" height="38" rx="4"/><text class="t" x="294" y="117" font-weight="600">14</text><rect class="d" x="328" y="94" width="38" height="38" rx="4"/><text class="t" x="338" y="117" font-weight="600">15</text><rect class="d" x="20" y="138" width="38" height="38" rx="4"/><text class="t" x="30" y="161" font-weight="600">16</text><rect class="d" x="64" y="138" width="38" height="38" rx="4"/><text class="t" x="74" y="161" font-weight="600">17</text><rect class="d" x="108" y="138" width="38" height="38" rx="4"/><text class="t" x="118" y="161" font-weight="600">18</text><rect class="d" x="152" y="138" width="38" height="38" rx="4"/><text class="t" x="162" y="161" font-weight="600">19</text><rect class="d" x="196" y="138" width="38" height="38" rx="4"/><text class="t" x="206" y="161" font-weight="600">20</text><rect class="d" x="240" y="138" width="38" height="38" rx="4"/><text class="t" x="250" y="161" font-weight="600">21</text><rect class="d" x="284" y="138" width="38" height="38" rx="4"/><text class="t" x="294" y="161" font-weight="600">22</text><rect class="d" x="328" y="138" width="38" height="38" rx="4"/><text class="t" x="338" y="161" font-weight="600">23</text><rect class="d" x="20" y="182" width="38" height="38" rx="4"/><text class="t" x="30" y="205" font-weight="600">24</text><rect class="d" x="64" y="182" width="38" height="38" rx="4"/><text class="t" x="74" y="205" font-weight="600">25</text><rect class="d" x="108" y="182" width="38" height="38" rx="4"/><text class="t" x="118" y="205" font-weight="600">26</text><rect class="d" x="152" y="182" width="38" height="38" rx="4"/><text class="t" x="162" y="205" font-weight="600">27</text><rect class="d" x="196" y="182" width="38" height="38" rx="4"/><text class="t" x="206" y="205" font-weight="600">28</text><rect class="d" x="240" y="182" width="38" height="38" rx="4"/><text class="t" x="250" y="205" font-weight="600">29</text><rect class="d" x="284" y="182" width="38" height="38" rx="4"/><text class="t" x="294" y="205" font-weight="600">30</text><rect class="d" x="328" y="182" width="38" height="38" rx="4"/><text class="t" x="338" y="205" font-weight="600">31</text><text class="m" x="20" y="238" font-size="11" text-anchor="start">32 lanes (8 × 4 shown)</text><rect class="b" x="400" y="50" width="200" height="160" rx="4"/><text class="t" x="410" y="70" font-weight="600">VGPR v0..v255</text><text class="m" x="410" y="86">one copy per lane</text><rect class="b" x="400" y="230" width="200" height="50" rx="4"/><text class="t" x="410" y="250" font-weight="600">SGPR s0..s101</text><text class="m" x="410" y="266">one copy per wave</text><rect class="b" x="630" y="50" width="200" height="60" rx="4"/><text class="t" x="640" y="70" font-weight="600">p0..p3</text><text class="m" x="640" y="86">32-bit lane mask</text><rect class="b" x="630" y="130" width="200" height="60" rx="4"/><text class="t" x="640" y="150" font-weight="600">SCC</text><text class="m" x="640" y="166">one bit per wave</text><rect class="b" x="630" y="210" width="200" height="70" rx="4"/><text class="t" x="640" y="230" font-weight="600">Masked write</text><text class="m" x="640" y="246">suppresses, does not clear</text><line class="a" x1="370" y1="110" x2="400" y2="110"/><line class="a" x1="370" y1="170" x2="400" y2="170"/><text class="m" x="20" y="320" font-size="11" text-anchor="start">A lane executes the same instruction stream; the scalar file is shared by all lanes.</text><text class="m" x="20" y="338" font-size="11" text-anchor="start">An instruction selects one of p0..p3; lanes outside it keep their previous destination value.</text></svg>
