<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">LG200 graphics submission path</title>
  <desc id="desc">A driver builds BOs in a GPU VM, writes a VMID+IB wrapper to the GPIPE ring, the IB carries the 528-dword full-state envelope, the state object selects a stage record whose kernel entry runs the shader, and a fence completes the submission.</desc>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334b5c"/></marker>
    <style>
      .frame { fill:#f7f9fb; stroke:#8796a2; stroke-width:2; }
      .box { stroke:#253746; stroke-width:2; rx:6; }
      .line { stroke:#334b5c; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#697d8c; stroke-width:2; stroke-dasharray:8 6; fill:none; marker-end:url(#arrow); }
      .title { font:700 20px sans-serif; fill:#17242f; }
      .label { font:700 15px sans-serif; fill:#17242f; }
      .small { font:12px sans-serif; fill:#263746; }
      .mono { font:12px monospace; fill:#263746; }
      .head { font:600 12px sans-serif; fill:#52645a; }
    </style>
  </defs>
  <rect x="25" y="25" width="1150" height="810" rx="8" class="frame"/>
  <text x="50" y="58" class="title">Graphics submission: ring, IB, full-state, shader, fence</text>

  <rect x="50" y="80" width="1090" height="60" class="box" fill="#dbe9f6"/>
  <text x="70" y="104" class="label">Driver</text>
  <text x="70" y="126" class="small">allocates BOs, maps them in the selected GPU VM, keeps them resident until the fence</text>

  <rect x="50" y="165" width="520" height="130" class="box" fill="#f4e2be"/>
  <text x="70" y="190" class="label">L1 GPIPE ring (dword stream)</text>
  <text x="70" y="212" class="mono">VMID(0) | IB(0) | ib_va[63:0] | length_dw[23:0]|vmid[31:24]</text>
  <text x="70" y="232" class="small">length counts inner command dwords</text>
  <text x="70" y="252" class="small">ring cursor pair 0x18 (write) / 0x1c (read)</text>
  <text x="70" y="272" class="small">VMID 0 is the kernel/control context; DRM uses VMIDs 1..3</text>

  <rect x="610" y="165" width="530" height="200" class="box" fill="#d9eee3"/>
  <text x="630" y="190" class="label">IB: 528-dword full-state envelope</text>
  <text x="630" y="212" class="mono">dword 0    0x00000f04      full-state command</text>
  <text x="630" y="230" class="mono">dword 1    10              mode/config</text>
  <text x="630" y="248" class="mono">dword 2    0x20000001      range record: 512 dwords</text>
  <text x="630" y="268" class="mono">dwords 3..514  512 dwords  graphical state object</text>
  <text x="630" y="288" class="mono">dword 515  0x00000003      state terminator</text>
  <text x="630" y="308" class="mono">dword 516  0x00000f05      end command</text>
  <text x="630" y="328" class="mono">dwords 517..527  zero      alignment</text>
  <text x="630" y="350" class="small">packet byte = state offset + 0x0c</text>

  <line x1="570" y1="230" x2="610" y2="230" class="line"/>

  <rect x="50" y="330" width="520" height="200" class="box" fill="#fff8e8"/>
  <text x="70" y="355" class="label">512-dword graphical state object</text>
  <text x="70" y="378" class="small">0x000 Draw Info | 0x030 Pipe Enables | 0x048 Viewport[0..15]</text>
  <text x="70" y="398" class="small">0x308 Guardband | 0x318 Line Raster | 0x324 Depth/Stencil/Blend</text>
  <text x="70" y="418" class="small">0x370 Color Buffer[0..7] | 0x470 Depth Buffer</text>
  <text x="70" y="440" class="small">0x4c0 Shader Config (stage enables) | 0x4c8..0x4e8 stage config</text>
  <text x="70" y="460" class="small">0x4f0 fragment map/input/output</text>
  <text x="70" y="482" class="small">0x540..0x780 six 0x60-byte shader-info slots</text>
  <text x="70" y="504" class="small">0x780 state tail (unassigned)</text>

  <line x1="570" y1="430" x2="610" y2="430" class="dash"/>

  <rect x="610" y="400" width="530" height="130" class="box" fill="#eadcf1"/>
  <text x="630" y="425" class="label">Active stage record (0x60 bytes)</text>
  <text x="630" y="447" class="mono">+0x00 resource word   +0x04 type   +0x06 code size</text>
  <text x="630" y="467" class="mono">+0x10 kernel_entry    +0x18 kernel_config</text>
  <text x="630" y="487" class="mono">+0x20..0x40 roots: rw / cb / constant / rsd / attr</text>
  <text x="630" y="507" class="mono">+0x48 arguments 0..3</text>
  <text x="630" y="522" class="small">selected by Shader Config enable bit; type matches the stage role</text>

  <rect x="50" y="570" width="520" height="110" class="box" fill="#dbe9f6"/>
  <text x="70" y="595" class="label">L3 shader execution</text>
  <text x="70" y="617" class="mono">kernel_entry -&gt; 8-byte INST_LO/INST_HI words</text>
  <text x="70" y="637" class="small">live-in SGPR/VGPR hydration; descriptor tuples in operands</text>
  <text x="70" y="657" class="small">SIO export -&gt; check -&gt; exit</text>
  <line x1="310" y1="530" x2="310" y2="570" class="line"/>

  <rect x="610" y="570" width="530" height="110" class="box" fill="#f8f0f8"/>
  <text x="630" y="595" class="label">Resources (all in the selected VM)</text>
  <text x="630" y="617" class="small">shader code BO    descriptors (buffer/image/sampler/attribute)</text>
  <text x="630" y="637" class="small">constants / vertices / images / render targets / results</text>
  <text x="630" y="657" class="small">every range mapped and resident until the completion fence</text>

  <rect x="50" y="715" width="1090" height="70" class="box" fill="#eef3f0"/>
  <text x="70" y="740" class="label">Completion</text>
  <text x="70" y="762" class="mono">VMID(0) | WB32(0) | address64 | sequence32 | DBAR(0)</text>
  <text x="70" y="778" class="small">fence write visible to the CPU after DBAR orders the command-processor writes</text>
  <line x1="310" y1="680" x2="310" y2="715" class="line"/>
</svg>
