<text x="106" y="290" text-anchor="middle" fill="#111">Texture Unit</text>
<text x="106" y="308" text-anchor="middle" fill="#555" font-size="11">fetch, filter, compare</text>
<text x="295" y="290" text-anchor="middle" fill="#111">Vector Memory</text>
<text x="295" y="308" text-anchor="middle" fill="#555" font-size="11">addressing, ray tracing</text>
<text x="484" y="290" text-anchor="middle" fill="#111">Data Cache</text>
<text x="484" y="308" text-anchor="middle" fill="#555" font-size="11">write-through to L2</text>
<text x="673" y="290" text-anchor="middle" fill="#111">Shared Memory</text>
<text x="673" y="308" text-anchor="middle" fill="#555" font-size="11">workgroup allocation</text>

<text x="16" y="350" fill="#111" font-size="11">A wave is the unit of scheduling and the smallest unit of work; a vector unit keeps several waves resident and selects among them.</text>
<text x="16" y="366" fill="#111" font-size="11">Vector registers are private to a lane, scalar registers are shared by a wave, and one lane-mask register covers exactly one wave.</text>
<text x="16" y="388" fill="#555" font-size="11">The block structure is the organisation Loongson publishes for this GPU family.  Unit counts, lane counts and issue width are not</text>
<text x="16" y="403" fill="#555" font-size="11">independently established for LG200 here; the values LG200 evidence does establish are on the generation profile.</text>
