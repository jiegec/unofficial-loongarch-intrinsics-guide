<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}.x{stroke:#5a6478;stroke-width:1.2;fill:none;stroke-dasharray:5 4}</style>
<text class="t" x="20" y="24" font-weight="700">Graphics pipeline and SIO</text>
<rect class="b" x="20" y="80" width="150" height="80" rx="4"/><text class="t" x="30" y="100" font-weight="600">Vertex</text><text class="m" x="30" y="116">SIO0 writer</text>
<rect class="b" x="200" y="80" width="150" height="80" rx="4"/><text class="t" x="210" y="100" font-weight="600">Geometry</text><text class="m" x="210" y="116">SIO0 to SIO1</text>
<rect class="b" x="380" y="80" width="150" height="80" rx="4"/><text class="t" x="390" y="100" font-weight="600">Rasterizer</text><text class="m" x="390" y="116">fixed</text>
<rect class="b" x="560" y="80" width="150" height="80" rx="4"/><text class="t" x="570" y="100" font-weight="600">Fragment</text><text class="m" x="570" y="116">SIO1 writer</text>
<rect class="b" x="740" y="80" width="120" height="80" rx="4"/><text class="t" x="750" y="100" font-weight="600">Output merger</text><text class="m" x="750" y="116">depth / blend</text>
<line class="a" x1="170" y1="120" x2="200" y2="120"/><line class="a" x1="350" y1="120" x2="380" y2="120"/><line class="a" x1="530" y1="120" x2="560" y2="120"/><line class="a" x1="710" y1="120" x2="740" y2="120"/>
<text class="m" x="174" y="68" font-size="10">SIO0</text><text class="m" x="354" y="68" font-size="10">SIO1</text><text class="m" x="714" y="68" font-size="10">SIO1</text>
<path class="x" d="M95 160 C95 205 455 205 455 160"/>
<text class="m" x="225" y="215" font-size="10">no geometry: vertex output reaches the rasterizer directly</text>
<rect class="d" x="20" y="260" width="250" height="55" rx="4"/><text class="t" x="30" y="280" font-weight="600">Descriptor roots</text><text class="m" x="30" y="296">s4:s5 constant · s6:s7 image/sampler</text>
<rect class="d" x="300" y="260" width="250" height="55" rx="4"/><text class="t" x="310" y="280" font-weight="600">Vertex input</text><text class="m" x="310" y="296">attribute table s8:s9</text>
<rect class="d" x="580" y="260" width="280" height="55" rx="4"/><text class="t" x="590" y="280" font-weight="600">Fragment output</text><text class="m" x="590" y="296">colour and depth channels to SIO1</text>
<text class="m" x="20" y="340" font-size="11">A geometry stage consumes SIO0 and writes SIO1; without one, the vertex stage feeds the rasterizer.</text>
</svg>