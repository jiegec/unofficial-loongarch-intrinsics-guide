<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}</style>
<text class="t" x="20" y="24" font-weight="700">Ownership and command path</text><rect class="b" x="20" y="50" width="180" height="110" rx="4"/><text class="t" x="30" y="70" font-weight="600">User mode</text><text class="m" x="30" y="86">application + UMD</text><rect class="b" x="20" y="220" width="180" height="110" rx="4"/><text class="t" x="30" y="240" font-weight="600">Kernel</text><text class="m" x="30" y="256">rings, MMU, fences</text><rect class="d" x="250" y="50" width="150" height="300" rx="4"/><text class="t" x="260" y="70" font-weight="600">Rings</text><text class="m" x="260" y="86">GPIPE / BPIPE / CPIPE / XDMA</text><rect class="d" x="262" y="78" width="126" height="44" rx="4"/><text class="t" x="272" y="104" font-weight="600">graphics</text><rect class="d" x="262" y="144" width="126" height="44" rx="4"/><text class="t" x="272" y="170" font-weight="600">blit</text><rect class="d" x="262" y="210" width="126" height="44" rx="4"/><text class="t" x="272" y="236" font-weight="600">compute</text><rect class="d" x="262" y="276" width="126" height="44" rx="4"/><text class="t" x="272" y="302" font-weight="600">transfer</text><rect class="d" x="450" y="50" width="150" height="300" rx="4"/><text class="t" x="460" y="70" font-weight="600">Command processors</text><text class="m" x="460" y="86">one per ring</text><rect class="d" x="462" y="78" width="126" height="44" rx="4"/><text class="t" x="472" y="104" font-weight="600">GPIPE</text><rect class="d" x="462" y="144" width="126" height="44" rx="4"/><text class="t" x="472" y="170" font-weight="600">BPIPE</text><rect class="d" x="462" y="210" width="126" height="44" rx="4"/><text class="t" x="472" y="236" font-weight="600">CPIPE</text><rect class="d" x="462" y="276" width="126" height="44" rx="4"/><text class="t" x="472" y="302" font-weight="600">XDMA</text><rect class="b" x="650" y="50" width="180" height="110" rx="4"/><text class="t" x="660" y="70" font-weight="600">Stream processor</text><text class="m" x="660" y="86">waves, VGPR/SGPR, masks</text><rect class="b" x="650" y="190" width="180" height="100" rx="4"/><text class="t" x="660" y="210" font-weight="600">Fixed-function graphics</text><text class="m" x="660" y="226">raster, depth, blend, texture</text><rect class="b" x="650" y="330" width="180" height="50" rx="4"/><text class="t" x="660" y="350" font-weight="600">Memory</text><text class="m" x="660" y="366">GPU VA, LDS, scratch</text><line class="a" x1="200" y1="105" x2="250" y2="105"/><line class="a" x1="200" y1="265" x2="250" y2="265"/><line class="a" x1="400" y1="110" x2="450" y2="110"/><line class="a" x1="600" y1="110" x2="650" y2="110"/><line class="a" x1="740" y1="160" x2="740" y2="190"/><line class="a" x1="740" y1="290" x2="740" y2="330"/><line class="a" x1="650" y1="215" x2="600" y2="215"/><line class="a" x1="830" y1="110" x2="830" y2="190"/><text class="m" x="20" y="390" font-size="11" text-anchor="start">A user-mode driver builds memory objects and indirect buffers; the kernel owns rings, page tables and fences.</text><text class="m" x="20" y="408" font-size="11" text-anchor="start">The stream processor executes shader waves; fixed-function blocks consume and produce surfaces in memory.</text></svg>
