<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}.x{stroke:#5a6478;stroke-width:1.2;fill:none;stroke-dasharray:5 4}</style>
<text class="t" x="20" y="24" font-weight="700">Ownership and command path</text>
<rect class="b" x="20" y="50" width="160" height="100" rx="4"/><text class="t" x="30" y="70" font-weight="600">User mode</text><text class="m" x="30" y="86">application + UMD</text>
<rect class="b" x="20" y="220" width="160" height="100" rx="4"/><text class="t" x="30" y="240" font-weight="600">Kernel</text><text class="m" x="30" y="256">rings, MMU, fences</text>
<rect class="b" x="230" y="50" width="150" height="300" rx="4"/><text class="t" x="240" y="70" font-weight="600">Rings</text>
<rect class="b" x="242" y="82" width="126" height="44" rx="4"/><text class="t" x="252" y="108" font-weight="600">graphics</text><rect class="b" x="242" y="146" width="126" height="44" rx="4"/><text class="t" x="252" y="172" font-weight="600">blit</text><rect class="b" x="242" y="210" width="126" height="44" rx="4"/><text class="t" x="252" y="236" font-weight="600">compute</text><rect class="b" x="242" y="274" width="126" height="44" rx="4"/><text class="t" x="252" y="300" font-weight="600">transfer</text>
<rect class="b" x="430" y="50" width="150" height="300" rx="4"/><text class="t" x="440" y="70" font-weight="600">Command processors</text>
<rect class="b" x="442" y="82" width="126" height="44" rx="4"/><text class="t" x="452" y="108" font-weight="600">GPIPE</text><rect class="b" x="442" y="146" width="126" height="44" rx="4"/><text class="t" x="452" y="172" font-weight="600">BPIPE</text><rect class="b" x="442" y="210" width="126" height="44" rx="4"/><text class="t" x="452" y="236" font-weight="600">CPIPE</text><rect class="b" x="442" y="274" width="126" height="44" rx="4"/><text class="t" x="452" y="300" font-weight="600">XDMA</text>
<rect class="b" x="630" y="50" width="170" height="100" rx="4"/><text class="t" x="640" y="70" font-weight="600">Stream processor</text><text class="m" x="640" y="86">waves, VGPR/SGPR, masks</text>
<rect class="b" x="630" y="190" width="170" height="100" rx="4"/><text class="t" x="640" y="210" font-weight="600">Fixed-function graphics</text><text class="m" x="640" y="226">raster, depth, blend, texture</text>
<rect class="b" x="630" y="330" width="170" height="50" rx="4"/><text class="t" x="640" y="350" font-weight="600">Memory</text><text class="m" x="640" y="366">GPU VA, LDS, scratch</text>
<line class="a" x1="180" y1="100" x2="180" y2="220"/><line class="a" x1="180" y1="270" x2="230" y2="270"/>
<line class="a" x1="380" y1="110" x2="430" y2="110"/><line class="a" x1="580" y1="110" x2="630" y2="110"/>
<line class="a" x1="715" y1="150" x2="715" y2="190"/><line class="a" x1="715" y1="290" x2="715" y2="330"/>

<text class="m" x="20" y="400" font-size="11">A user-mode driver builds memory objects and indirect buffers; the kernel owns rings, page tables and fences.</text>
