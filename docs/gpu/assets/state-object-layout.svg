<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">LG200 512-dword graphical state object layout</title>
  <desc id="desc">The 512-dword state object maps Draw Info, Pipe Enables, 16 viewports, depth/stencil/blend state, color and depth buffers, shader configuration, six 0x60-byte shader-info slots, and a state tail at fixed offsets.</desc>
  <defs>
    <style>
      .frame { fill:#f7f9fb; stroke:#8796a2; stroke-width:2; }
      .row { stroke:#334b5c; stroke-width:1.4; rx:3; }
      .label { font:600 13px sans-serif; fill:#17242f; }
      .off { font:12px monospace; fill:#52645a; }
      .size { font:11px sans-serif; fill:#697d8c; }
      .title { font:700 20px sans-serif; fill:#17242f; }
      .head { font:600 12px sans-serif; fill:#52645a; }
    </style>
  </defs>
  <rect x="20" y="20" width="960" height="720" rx="8" class="frame"/>
  <text x="40" y="52" class="title">512-dword graphical state object (state offset = dword index)</text>
  <text x="40" y="74" class="head">packet byte = state offset + 0x0c; the object starts at IB dword 3.</text>

  <!-- left column (x=40, width=430), right column (x=520, width=430); rows from y=100, height=46 gap 4 -->
  <g transform="translate(40,100)">
    <g>
      <rect x="0" y="0" width="430" height="42" class="row" fill="#dbe9f6"/>
      <text x="12" y="18" class="label">Draw Info</text>
      <text x="12" y="34" class="size">index/topology/count/address fields</text>
      <text x="440" y="18" class="off">0x000</text>
      <text x="440" y="34" class="size">0x024</text>
    </g>
    <g>
      <rect x="0" y="46" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="64" class="label">draw tail</text>
      <text x="440" y="64" class="off">0x024</text>
      <text x="440" y="80" class="size">0x00c</text>
    </g>
    <g>
      <rect x="0" y="92" width="430" height="42" class="row" fill="#d9eee3"/>
      <text x="12" y="110" class="label">Pipe Enables</text>
      <text x="12" y="126" class="size">raster/clip/msaa/MRT/stage flags</text>
      <text x="440" y="110" class="off">0x030</text>
      <text x="440" y="126" class="size">0x00c</text>
    </g>
    <g>
      <rect x="0" y="138" width="430" height="46" class="row" fill="#f4e2be"/>
      <text x="12" y="156" class="label">Viewport[0..15]</text>
      <text x="12" y="172" class="size">16 x 40-byte records: scale/offset, scissor, depth</text>
      <text x="440" y="156" class="off">0x048</text>
      <text x="440" y="172" class="size">0x2c0</text>
    </g>
    <g>
      <rect x="0" y="188" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="206" class="label">Guardband</text>
      <text x="12" y="222" class="size">four float bit patterns</text>
      <text x="440" y="206" class="off">0x308</text>
      <text x="440" y="222" class="size">0x010</text>
    </g>
    <g>
      <rect x="0" y="234" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="252" class="label">Line Raster</text>
      <text x="12" y="268" class="size">stipple / point size / line width</text>
      <text x="440" y="252" class="off">0x318</text>
      <text x="440" y="268" class="size">0x00c</text>
    </g>
    <g>
      <rect x="0" y="280" width="430" height="42" class="row" fill="#d9eee3"/>
      <text x="12" y="298" class="label">Depth Control</text>
      <text x="12" y="314" class="size">depth enable/write/function, polygon offset</text>
      <text x="440" y="298" class="off">0x324</text>
      <text x="440" y="314" class="size">0x010</text>
    </g>
    <g>
      <rect x="0" y="326" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="344" class="label">Stencil front / back</text>
      <text x="12" y="360" class="size">enable/function/operations/masks</text>
      <text x="440" y="344" class="off">0x334</text>
      <text x="440" y="360" class="size">0x008</text>
    </g>
    <g>
      <rect x="0" y="372" width="430" height="42" class="row" fill="#f4e2be"/>
      <text x="12" y="390" class="label">Blend Control / Blend RT[0..7]</text>
      <text x="12" y="406" class="size">gates, per-RT equations, logic-op</text>
      <text x="440" y="390" class="off">0x33c</text>
      <text x="440" y="406" class="size">0x024</text>
    </g>
    <g>
      <rect x="0" y="418" width="430" height="46" class="row" fill="#dbe9f6"/>
      <text x="12" y="436" class="label">Color Buffer[0..7]</text>
      <text x="12" y="452" class="size">eight 0x20-byte surface records</text>
      <text x="440" y="436" class="off">0x370</text>
      <text x="440" y="452" class="size">0x100</text>
    </g>
    <g>
      <rect x="0" y="468" width="430" height="42" class="row" fill="#dbe9f6"/>
      <text x="12" y="486" class="label">Depth Buffer</text>
      <text x="12" y="502" class="size">one 0x20-byte surface record</text>
      <text x="440" y="486" class="off">0x470</text>
      <text x="440" y="502" class="size">0x020</text>
    </g>
    <g>
      <rect x="0" y="514" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="532" class="label">pipeline config</text>
      <text x="12" y="548" class="size">not assigned by the current schema</text>
      <text x="440" y="532" class="off">0x490</text>
      <text x="440" y="548" class="size">0x030</text>
    </g>
    <g>
      <rect x="0" y="560" width="430" height="42" class="row" fill="#eadcf1"/>
      <text x="12" y="578" class="label">Shader Config</text>
      <text x="12" y="594" class="size">stage enables + tess/geom controls</text>
      <text x="440" y="578" class="off">0x4c0</text>
      <text x="440" y="594" class="size">0x008</text>
    </g>
    <g>
      <rect x="0" y="606" width="430" height="42" class="row" fill="#eef3f0"/>
      <text x="12" y="624" class="label">VS / HS / DS / GS / SS Stage Config</text>
      <text x="12" y="640" class="size">inputs and output sizes per stage</text>
      <text x="440" y="624" class="off">0x4c8</text>
      <text x="440" y="640" class="size">0x028</text>
    </g>
    <g>
      <rect x="0" y="652" width="430" height="46" class="row" fill="#f8f0f8"/>
      <text x="12" y="670" class="label">Fragment Attribute Map / Input / Output</text>
      <text x="12" y="686" class="size">32 entries, input config, MRT format</text>
      <text x="440" y="670" class="off">0x4f0</text>
      <text x="440" y="686" class="size">0x050</text>
    </g>
  </g>

  <!-- right column: shader-info slots -->
  <g transform="translate(520,100)">
    <text x="0" y="0" class="head">Six 0x60-byte shader-info slots</text>
    <g>
      <rect x="0" y="8" width="430" height="52" class="row" fill="#dbe9f6"/>
      <text x="12" y="28" class="label">VS Shader Info</text>
      <text x="12" y="46" class="size">standalone type not assigned</text>
      <text x="440" y="28" class="off">0x540</text>
      <text x="440" y="46" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="64" width="430" height="52" class="row" fill="#dbe9f6"/>
      <text x="12" y="84" class="label">HS Shader Info</text>
      <text x="12" y="102" class="size">standalone type not assigned</text>
      <text x="440" y="84" class="off">0x5a0</text>
      <text x="440" y="102" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="120" width="430" height="52" class="row" fill="#d9eee3"/>
      <text x="12" y="140" class="label">DS Shader Info (ordinary vertex)</text>
      <text x="12" y="158" class="size">type 3; kernel_entry at record +0x10</text>
      <text x="440" y="140" class="off">0x600</text>
      <text x="440" y="158" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="176" width="430" height="52" class="row" fill="#f4e2be"/>
      <text x="12" y="196" class="label">GS Shader Info</text>
      <text x="12" y="214" class="size">type 4; ring channels and emit state</text>
      <text x="440" y="196" class="off">0x660</text>
      <text x="440" y="214" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="232" width="430" height="52" class="row" fill="#f8f0f8"/>
      <text x="12" y="252" class="label">SS Shader Info</text>
      <text x="12" y="270" class="size">type 6; streamout roots</text>
      <text x="440" y="252" class="off">0x6c0</text>
      <text x="440" y="270" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="288" width="430" height="52" class="row" fill="#eadcf1"/>
      <text x="12" y="308" class="label">PS Shader Info</text>
      <text x="12" y="326" class="size">type 5; fragment live-ins and SIO1</text>
      <text x="440" y="308" class="off">0x720</text>
      <text x="440" y="326" class="size">0x060</text>
    </g>
    <g>
      <rect x="0" y="344" width="430" height="52" class="row" fill="#eef3f0"/>
      <text x="12" y="364" class="label">state tail</text>
      <text x="12" y="382" class="size">no common meaning assigned</text>
      <text x="440" y="364" class="off">0x780</text>
      <text x="440" y="382" class="size">0x080</text>
    </g>
    <text x="0" y="430" class="head">Record fields: +0x00 resource word, +0x04 type,</text>
    <text x="0" y="448" class="head">+0x10 kernel_entry, +0x20..0x40 roots, +0x48 args.</text>
  </g>
</svg>
