<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
<rect width="1000" height="540" fill="#ffffff"/>
<style>
  .ttl{font-family:"DejaVu Sans",sans-serif;font-size:16px;font-weight:700;fill:#10141c}
  .sub{font-family:"DejaVu Sans",sans-serif;font-size:11px;fill:#5a6478}
  .hd {font-family:"DejaVu Sans",sans-serif;font-size:11px;fill:#5a6478}
  .bt {font-family:"DejaVu Sans",sans-serif;font-size:12px;font-weight:700;fill:#10141c}
  .bd {font-family:"DejaVu Sans",sans-serif;font-size:11px;fill:#5a6478}
  .bi {font-family:"DejaVu Sans",sans-serif;font-size:11px;fill:#10141c}
  .hx {font-family:"DejaVu Sans Mono",monospace;font-size:11px;fill:#10141c}
  .ac {font-family:"DejaVu Sans",sans-serif;font-size:11px;fill:#2f5d8a}
  .band{fill:#eef2f8;stroke:#44506a;stroke-width:1.25}
  .tick{stroke:#44506a;stroke-width:1.25}
  .sep {stroke:#5a6478;stroke-width:1;stroke-dasharray:4 4;opacity:0.55}
  .cut {stroke:#ffffff;stroke-width:4}
</style>

<text class="ttl" x="24" y="28">Client GPU VA: one 1 TiB window, two apertures outside it</text>
<text class="sub" x="24" y="48">Flat addresses are 64-bit; the client walk covers 40 bits and the ioctl keeps the low 48. Not to scale.</text>

<text class="hd" x="24" y="72">client address axis — bottom is 0</text>
<text class="hd" x="560" y="72">apertures — a separate decode, never on this axis</text>
<line class="sep" x1="536" y1="84" x2="536" y2="448"/>

<rect class="band" x="192" y="88"  width="312" height="48"/>
<rect class="band" x="192" y="136" width="312" height="56"/>
<rect class="band" x="192" y="192" width="312" height="48"/>
<rect class="band" x="192" y="240" width="312" height="192"/>
<rect class="band" x="192" y="432" width="312" height="32"/>

<g class="tick">
  <line x1="180" y1="88"  x2="192" y2="88"/>
  <line x1="180" y1="136" x2="192" y2="136"/>
  <line x1="180" y1="192" x2="192" y2="192"/>
  <line x1="180" y1="240" x2="192" y2="240"/>
  <line x1="180" y1="408" x2="192" y2="408"/>
  <line x1="180" y1="432" x2="192" y2="432"/>
  <line x1="180" y1="464" x2="192" y2="464"/>
</g>
<text class="hx" x="176" y="92"  text-anchor="end">0xFFFF_FFFF_FFFF_FFFF</text>
<text class="hx" x="176" y="140" text-anchor="end">0xFFFF_8000_0000_0000</text>
<text class="hx" x="176" y="196" text-anchor="end">0x0000_8000_0000_0000</text>
<text class="hx" x="176" y="244" text-anchor="end">0x0000_0100_0000_0000</text>
<text class="hx" x="176" y="412" text-anchor="end">0x0000_0001_0000_0000</text>
<text class="hx" x="176" y="436" text-anchor="end">0x0000_0000_0010_0000</text>
<text class="hx" x="176" y="468" text-anchor="end">0x0000_0000_0000_0000</text>

<g class="cut">
  <line x1="192" y1="170" x2="212" y2="150"/>
  <line x1="192" y1="180" x2="212" y2="160"/>
  <line x1="192" y1="220" x2="212" y2="200"/>
  <line x1="192" y1="230" x2="212" y2="210"/>
</g>
<g class="tick">
  <line x1="192" y1="170" x2="212" y2="150"/>
  <line x1="192" y1="180" x2="212" y2="160"/>
  <line x1="192" y1="220" x2="212" y2="200"/>
  <line x1="192" y1="230" x2="212" y2="210"/>
</g>

<text class="bt" x="220" y="104">high range — not published</text>
<text class="bd" x="220" y="120">high_va_offset = high_va_max = 0</text>

<text class="bt" x="220" y="152">hole — GEM_VA rejects it</text>
<text class="bd" x="220" y="168">2^47 … 0xFFFF_7FFF_FFFF_FFFF</text>
<text class="bd" x="220" y="184">both aperture bases fall in here</text>

<text class="bt" x="220" y="208">above the walk — no page table</text>
<text class="bd" x="220" y="224">1 TiB … 2^47 − 1 is unreachable</text>

<text class="bt" x="220" y="264">client VA window</text>
<text class="bd" x="220" y="280">one root page directory per VMID</text>

<text class="bi" x="220" y="312"><tspan x="220">dir0</tspan><tspan x="264">4 b</tspan><tspan x="308">[39:36]</tspan><tspan x="372">16 entries × 64 GiB</tspan></text>
<text class="bi" x="220" y="328"><tspan x="220">dir1</tspan><tspan x="264">11 b</tspan><tspan x="308">[35:25]</tspan><tspan x="372">2048 × 32 MiB</tspan></text>
<text class="bi" x="220" y="344"><tspan x="220">dir2</tspan><tspan x="264">11 b</tspan><tspan x="308">[24:14]</tspan><tspan x="372">2048 × 16 KiB</tspan></text>
<text class="bi" x="220" y="360"><tspan x="220">page</tspan><tspan x="308">[13:0]</tspan><tspan x="372">16 KiB</tspan></text>

<text class="ac" x="220" y="392">userspace allocator floor</text>
<text class="bd" x="220" y="424">published; this allocator stays above it</text>

<text class="bi" x="220" y="456">1 MiB reserved head — floor, no mapping</text>

<line x1="192" y1="408" x2="504" y2="408" stroke="#2f5d8a" stroke-width="2"/>

<text class="bt" x="560" y="104">LDS — group aperture</text>
<text class="bd" x="560" y="120"><tspan x="560">base</tspan><tspan x="608">0x0001_0000_0000_0000</tspan></text>
<text class="bd" x="560" y="136"><tspan x="560">span</tspan><tspan x="608">4 GiB, 0x0001_0000_0000_0000 … 0x0001_0000_FFFF_FFFF</tspan></text>
<text class="bd" x="560" y="152"><tspan x="560">tag</tspan><tspan x="608">bits 63:48 = 0x0001 → word 0x00010000</tspan></text>
<text class="bd" x="560" y="168">holds a per-workgroup window, 16 KiB advertised;</text>
<text class="bd" x="560" y="184">128 B granules, at most 2047 → 262,016 B</text>
<text class="bd" x="560" y="200">a zero group word is refused at queue creation</text>

<text class="bt" x="560" y="232">scratch — private aperture</text>
<text class="bd" x="560" y="248"><tspan x="560">base</tspan><tspan x="608">0x0002_0000_0000_0000</tspan></text>
<text class="bd" x="560" y="264"><tspan x="560">span</tspan><tspan x="608">4 GiB, 0x0002_0000_0000_0000 … 0x0002_0000_FFFF_FFFF</tspan></text>
<text class="bd" x="560" y="280"><tspan x="560">tag</tspan><tspan x="608">bits 63:48 = 0x0002 → word 0x00020000</tspan></text>
<text class="bd" x="560" y="296">holds per-invocation spill; its bytes are an ordinary</text>
<text class="bd" x="560" y="312">client BO, and the launch stages a descriptor for it</text>
<text class="bd" x="560" y="336">Both words ride the launch record, not a mapping.</text>

<line class="sep" x1="560" y1="360" x2="976" y2="360"/>
<text class="bd" x="560" y="376">0x0000 is the only tag that indexes page tables.</text>
<text class="bd" x="560" y="392">A request in 0x0001 is redirected to on-chip LDS,</text>
<text class="bd" x="560" y="408">one in 0x0002 to private memory expanded by work-item,</text>
<text class="bd" x="560" y="424">so GEM_VA also refuses the hole to client mappings.</text>

<text class="bd" x="24" y="492">VMIDs: 8 — 0 kernel (1-level GART), 1–3 DRM, 4–7 KCD; VMIDs 1–7 all get the 1 TiB geometry above.</text>
<text class="bd" x="24" y="510">Break marks mean a compressed span; every hex boundary here is a value from the driver sources.</text>
</svg>