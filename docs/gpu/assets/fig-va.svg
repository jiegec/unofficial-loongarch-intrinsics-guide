<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}</style>
<text class="t" x="20" y="24" font-weight="700">GPU virtual address space</text><rect class="d" x="20" y="60" width="840" height="50" rx="4"/><text class="t" x="30" y="89" font-weight="600"></text><rect class="d" x="20" y="60" width="110" height="50" rx="4"/><text class="t" x="30" y="89" font-weight="600">reserved 1 MiB</text><rect class="d" x="130" y="60" width="240" height="50" rx="4"/><text class="t" x="140" y="89" font-weight="600">low client range</text><rect class="d" x="370" y="60" width="150" height="50" rx="4"/><text class="t" x="380" y="89" font-weight="600">hole</text><rect class="d" x="520" y="60" width="240" height="50" rx="4"/><text class="t" x="530" y="89" font-weight="600">high client range</text><rect class="d" x="760" y="60" width="100" height="50" rx="4"/><text class="t" x="770" y="89" font-weight="600">apertures</text><text class="m" x="20" y="135" font-size="11" text-anchor="start">0x0000_0000_0000_0000</text><text class="m" x="840" y="135" font-size="10" text-anchor="end">0xffff_ffff_ffff_ffff</text><rect class="b" x="520" y="170" width="240" height="50" rx="4"/><text class="t" x="530" y="190" font-weight="600">LDS 0x1<<48</text><text class="m" x="530" y="206">4 GiB</text><rect class="b" x="520" y="230" width="240" height="50" rx="4"/><text class="t" x="530" y="250" font-weight="600">scratch 0x2<<48</text><text class="m" x="530" y="266">4 GiB</text><text class="m" x="20" y="205" font-size="11" text-anchor="start">Client mappings must not intersect the LDS or scratch aperture.</text><text class="m" x="20" y="223" font-size="11" text-anchor="start">The upper 16 bits of a 64-bit VA are ignored; the hole separates the two client ranges.</text><text class="m" x="20" y="285" font-size="11" text-anchor="start">Page-table entry: present, write, huge, exception, ZINF, physical page base.</text></svg>
