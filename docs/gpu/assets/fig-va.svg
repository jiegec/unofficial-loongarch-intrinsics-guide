<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.t{fill:#10141c}.m{fill:#5a6478}.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}.h{fill:#e6e6e6;stroke:#44506a;stroke-width:1.2}</style>
<text class="t" x="20" y="24" font-weight="700">GPU virtual address space (not to scale)</text>
<rect class="b" x="20" y="50" width="300" height="70" rx="4"/><text class="t" x="30" y="72" font-weight="600">high client range</text><text class="m" x="30" y="90">above 0xffff_8000_0000_0000</text>
<rect class="h" x="20" y="125" width="300" height="60" rx="4"/><text class="t" x="30" y="147" font-weight="600">hole</text><text class="m" x="30" y="165">0x0000_8000_0000_0000 – 0xffff_7fff_ffff_ffff</text>
<rect class="b" x="20" y="190" width="300" height="70" rx="4"/><text class="t" x="30" y="212" font-weight="600">low client range</text><text class="m" x="30" y="230">below 0x0000_8000_0000_0000</text>
<rect class="b" x="20" y="265" width="300" height="35" rx="4"/><text class="t" x="30" y="287" font-weight="600">reserved 1 MiB</text>
<text class="m" x="20" y="325">The upper 16 bits of a 64-bit VA are ignored; the hole separates the ranges.</text>
<line x1="360" y1="50" x2="360" y2="300" stroke="#5a6478" stroke-width="1" stroke-dasharray="4 4"/><rect class="d" x="390" y="70" width="300" height="70" rx="4"/><text class="t" x="400" y="92" font-weight="600">LDS aperture</text><text class="m" x="400" y="110">0x0001_0000_0000_0000 · 4 GiB</text>
<rect class="d" x="390" y="160" width="300" height="70" rx="4"/><text class="t" x="400" y="182" font-weight="600">scratch aperture</text><text class="m" x="400" y="200">0x0002_0000_0000_0000 · 4 GiB</text>
<text class="m" x="390" y="255">A client mapping must not intersect either aperture.</text>


</svg>