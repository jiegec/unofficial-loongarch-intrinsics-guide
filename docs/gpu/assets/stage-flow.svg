<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
</marker>
</defs>
<text x="16" y="18" fill="#111" font-size="13" font-weight="bold">Stage flow and the SIO rings</text>
<text x="16" y="34" fill="#555" font-size="10">Shader stages exchange data through SIO, a channel-addressed ring, and through descriptor-bound memory.</text>

<text x="16" y="54" fill="#333" font-size="10">Shader stages and the rings between them</text>

<rect x="16" y="62" width="150" height="44" fill="#e8f5e9" stroke="#444" rx="3"/>
<text x="91" y="82" text-anchor="middle" fill="#111">Vertex</text>
<text x="91" y="97" text-anchor="middle" fill="#555" font-size="10">v0 index, v1 instance</text>

<rect x="178" y="62" width="110" height="44" fill="#e8eaf6" stroke="#444" rx="3"/>
<text x="233" y="82" text-anchor="middle" fill="#111">SIO0 ring</text>
<text x="233" y="97" text-anchor="middle" fill="#555" font-size="10">vertex output</text>

<rect x="300" y="62" width="160" height="44" fill="#e8f5e9" stroke="#444" rx="3"/>
<text x="380" y="82" text-anchor="middle" fill="#111">Geometry</text>
<text x="380" y="97" text-anchor="middle" fill="#555" font-size="10">reads SIO0, emits to SIO1</text>

<rect x="472" y="62" width="110" height="44" fill="#e8eaf6" stroke="#444" rx="3"/>
<text x="527" y="82" text-anchor="middle" fill="#111">SIO1 ring</text>
<text x="527" y="97" text-anchor="middle" fill="#555" font-size="10">colour channels</text>

<rect x="594" y="62" width="160" height="44" fill="#f3e5f5" stroke="#444" rx="3"/>
<text x="674" y="82" text-anchor="middle" fill="#111">Fragment</text>
<text x="674" y="97" text-anchor="middle" fill="#555" font-size="10">v2:v3, v8:v9 barycentrics</text>

<line x1="166" y1="84" x2="176" y2="84" stroke="#666" marker-end="url(#b)"/>
<line x1="288" y1="84" x2="298" y2="84" stroke="#666" marker-end="url(#b)"/>
<line x1="460" y1="84" x2="470" y2="84" stroke="#666" marker-end="url(#b)"/>
<line x1="582" y1="84" x2="592" y2="84" stroke="#666" marker-end="url(#b)"/>

<text x="16" y="132" fill="#333" font-size="10">Fixed-function blocks between and around the stages</text>

<rect x="16" y="140" width="140" height="40" fill="#fff3e0" stroke="#444" rx="3"/>
<text x="86" y="158" text-anchor="middle" fill="#111" font-size="11">Primitive assembly</text>
<text x="86" y="172" text-anchor="middle" fill="#555" font-size="10">vertex fetch, topology</text>

<rect x="168" y="140" width="140" height="40" fill="#fff3e0" stroke="#444" rx="3"/>
<text x="238" y="158" text-anchor="middle" fill="#111" font-size="11">Rasterizer</text>
<text x="238" y="172" text-anchor="middle" fill="#555" font-size="10">viewport, cull, scissor</text>

<rect x="320" y="140" width="140" height="40" fill="#fff3e0" stroke="#444" rx="3"/>
<text x="390" y="158" text-anchor="middle" fill="#111" font-size="11">Interpolator</text>
<text x="390" y="172" text-anchor="middle" fill="#555" font-size="10">coefficient table</text>

<rect x="472" y="140" width="140" height="40" fill="#fff3e0" stroke="#444" rx="3"/>
<text x="542" y="158" text-anchor="middle" fill="#111" font-size="11">Depth and stencil</text>
<text x="542" y="172" text-anchor="middle" fill="#555" font-size="10">compare, write, offset</text>

<rect x="624" y="140" width="140" height="40" fill="#fff3e0" stroke="#444" rx="3"/>
<text x="694" y="158" text-anchor="middle" fill="#111" font-size="11">Blend</text>
<text x="694" y="172" text-anchor="middle" fill="#555" font-size="10">per target, logic op</text>

<rect x="16" y="188" width="748" height="26" fill="#fce4ec" stroke="#444" rx="3"/>
<text x="390" y="205" text-anchor="middle" fill="#111" font-size="11">Colour attachments[0..7] and the depth attachment</text>

<rect x="16" y="224" width="748" height="30" fill="#f5f5f5" stroke="#444" rx="3"/>
<text x="390" y="243" text-anchor="middle" fill="#111" font-size="11">stage epilogue:  write outputs  &#8594;  sioexport commits the channel count  &#8594;  check orders pending work  &#8594;  exit</text>

<text x="16" y="274" fill="#555" font-size="10">A stage reads its inputs from entry registers or the ring, and writes its outputs to a ring or through a descriptor.</text>
<text x="16" y="288" fill="#555" font-size="10">The vertex stage may fuse into the geometry stage, which then reads SIO0 directly and needs no vertex export.</text>
<text x="16" y="302" fill="#555" font-size="10">A discard or a demote restores the captured lane mask and continues; it does not run exit.</text>
<text x="16" y="316" fill="#555" font-size="10">There is no hull stage: the domain slot carries the ordinary vertex role, and a patch primitive is rejected.</text>
<text x="16" y="338" fill="#333" font-size="10">Streamout is a separate kernel in its own slot; no established graphics path installs it.</text>
<text x="16" y="358" fill="#333" font-size="10">The record each stage is configured by, and its entry registers, are in the shader ABI chapter.</text>
</svg>
