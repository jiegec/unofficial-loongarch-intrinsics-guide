<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="24" y="28" font-size="16" font-weight="bold" fill="#10141c">Shader roots: three dereferences to the payload</text>
  <text x="24" y="52" font-size="12" fill="#5a6478">A root register pair holds a 64-bit base address; every step below it is one scalar load the shader issues.</text>
  <text x="24" y="68" font-size="12" fill="#5a6478">The payload is three loads away: set pointer, slot record, then the address stored in that record.</text>

  <!-- root pair -->
  <rect x="96" y="88" width="32" height="32" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="128" y="88" width="32" height="32" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="112" y="109" font-size="11" fill="#10141c" text-anchor="middle">s6</text>
  <text x="144" y="109" font-size="11" fill="#10141c" text-anchor="middle">s7</text>
  <text x="176" y="104" font-size="11" fill="#10141c">descriptor root</text>
  <text x="176" y="120" font-size="11" fill="#5a6478">image/sampler table (graphics) · kernarg (compute)</text>
  <text x="176" y="144" font-size="11" fill="#10141c">1 · root + set·0x10 — 16 B pointer</text>

  <!-- the one accent path: three hops with their heads -->
  <path d="M112 128 V146 M112 248 V266 M112 472 V490 M109 146 L115 146 L112 152 Z M109 266 L115 266 L112 272 Z M109 490 L115 490 L112 496 Z" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1.25" stroke-linejoin="round"/>

  <!-- pointer table -->
  <rect x="96" y="160" width="152" height="16" fill="#eef2f8" stroke="#10141c" stroke-width="2"/>
  <rect x="96" y="176" width="152" height="16" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="96" y="192" width="152" height="16" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="96" y="208" width="152" height="16" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="96" y="224" width="152" height="16" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="104" y="171" font-size="11" fill="#10141c">set 0</text>
  <text x="104" y="187" font-size="11" fill="#10141c">set 1</text>
  <text x="104" y="203" font-size="11" fill="#10141c">set 2</text>
  <text x="104" y="219" font-size="11" fill="#10141c">set 3</text>
  <text x="104" y="235" font-size="11" fill="#5a6478">private</text>
  <text x="260" y="174" font-size="11" fill="#5a6478">5 records × 16 B</text>
  <text x="260" y="190" font-size="11" fill="#5a6478">stride 0x10, at root + 0x00</text>

  <text x="176" y="264" font-size="11" fill="#10141c">2 · set base + (handle &amp; 0x1ffffff) — 0x40 slot</text>

  <!-- slot array -->
  <rect x="96" y="280" width="32" height="64" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="128" y="280" width="32" height="64" fill="#eef2f8" stroke="#10141c" stroke-width="2"/>
  <rect x="160" y="280" width="32" height="64" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="192" y="280" width="32" height="64" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="112" y="336" font-size="11" fill="#5a6478" text-anchor="middle">0</text>
  <text x="144" y="336" font-size="11" fill="#5a6478" text-anchor="middle">1</text>
  <text x="176" y="336" font-size="11" fill="#5a6478" text-anchor="middle">2</text>
  <text x="208" y="336" font-size="11" fill="#5a6478" text-anchor="middle">3</text>
  <text x="240" y="296" font-size="11" fill="#5a6478">0x40 per slot = 64 B</text>
  <text x="240" y="312" font-size="11" fill="#5a6478">slot n at set base + n·0x40</text>

  <path d="M144 344 V360" fill="none" stroke="#5a6478" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="160" y="360" font-size="11" fill="#5a6478">one slot, opened</text>

  <!-- opened slot -->
  <rect x="96" y="368" width="144" height="48" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="104" y="396" font-size="11" fill="#10141c">image · 32 B</text>
  <text x="232" y="396" font-size="11" fill="#5a6478" text-anchor="end">+0x00</text>

  <rect x="96" y="416" width="144" height="24" fill="none" stroke="#44506a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="104" y="432" font-size="11" fill="#5a6478">gap · 16 B</text>
  <text x="232" y="432" font-size="11" fill="#5a6478" text-anchor="end">+0x20</text>

  <rect x="96" y="440" width="144" height="24" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="104" y="456" font-size="11" fill="#10141c">sampler · 16 B</text>
  <text x="232" y="456" font-size="11" fill="#5a6478" text-anchor="end">+0x30</text>

  <text x="176" y="488" font-size="11" fill="#10141c">3 · record base + byte offset — payload</text>

  <!-- payload -->
  <rect x="96" y="504" width="152" height="48" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="104" y="528" font-size="12" fill="#10141c">payload bytes</text>
  <text x="260" y="520" font-size="11" fill="#5a6478">via buffer base [47:0]</text>
  <text x="260" y="536" font-size="11" fill="#5a6478">via image base [39:0]</text>

  <!-- compute root page map -->
  <text x="552" y="88" font-size="11" fill="#10141c">compute root page · s6:s7</text>
  <path d="M552 96 V272" fill="none" stroke="#44506a" stroke-width="1"/>
  <path d="M544 96 H552 M544 120 H552 M544 144 H552 M544 232 H552 M544 248 H552 M544 272 H552" fill="none" stroke="#44506a" stroke-width="1"/>
  <rect x="560" y="96" width="80" height="24" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="560" y="120" width="80" height="24" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="560" y="144" width="80" height="88" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="560" y="232" width="80" height="16" fill="none" stroke="#44506a" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="560" y="248" width="80" height="24" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="534" y="100" font-size="11" fill="#5a6478" text-anchor="end">0x00</text>
  <text x="534" y="124" font-size="11" fill="#5a6478" text-anchor="end">0x50</text>
  <text x="534" y="148" font-size="11" fill="#5a6478" text-anchor="end">0x90</text>
  <text x="534" y="236" font-size="11" fill="#5a6478" text-anchor="end">0x190</text>
  <text x="534" y="252" font-size="11" fill="#5a6478" text-anchor="end">0x1c0</text>
  <text x="534" y="276" font-size="11" fill="#5a6478" text-anchor="end">0x200</text>
  <text x="656" y="112" font-size="11" fill="#10141c">set pointer table · 0x50 · hop 1</text>
  <text x="656" y="136" font-size="11" fill="#5a6478">implicit args · 0x40</text>
  <text x="656" y="192" font-size="11" fill="#10141c">push constants · 0x100</text>
  <text x="656" y="244" font-size="11" fill="#5a6478">scratch base + signal</text>
  <text x="656" y="264" font-size="11" fill="#10141c">descriptor slots · 0x40 · hop 2</text>
  <text x="552" y="294" font-size="11" fill="#5a6478">Hop 1 reads +0x00 of this page; hop 2 lands in the same page</text>
  <text x="552" y="310" font-size="11" fill="#5a6478">and the slot array runs on to the page end at +0x4000.</text>

  <!-- graphics constant root map -->
  <text x="552" y="336" font-size="11" fill="#10141c">graphics constant root · s4:s5</text>
  <path d="M552 344 V520" fill="none" stroke="#44506a" stroke-width="1"/>
  <path d="M544 344 H552 M544 424 H552 M544 440 H552 M544 520 H552" fill="none" stroke="#44506a" stroke-width="1"/>
  <rect x="560" y="344" width="80" height="80" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="560" y="424" width="80" height="16" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <rect x="560" y="440" width="80" height="80" fill="#eef2f8" stroke="#44506a" stroke-width="1.25"/>
  <text x="534" y="348" font-size="11" fill="#5a6478" text-anchor="end">0x4000</text>
  <text x="534" y="428" font-size="11" fill="#5a6478" text-anchor="end">0x4100</text>
  <text x="534" y="444" font-size="11" fill="#5a6478" text-anchor="end">0x4130</text>
  <text x="534" y="524" font-size="11" fill="#5a6478" text-anchor="end">0x4230</text>
  <text x="656" y="388" font-size="11" fill="#10141c">push constants · 0x100</text>
  <text x="656" y="436" font-size="11" fill="#5a6478">draw params · 0x30</text>
  <text x="656" y="484" font-size="11" fill="#10141c">attribute table · 16 × 16 B †</text>
  <text x="552" y="544" font-size="11" fill="#5a6478">No set table on this root: both windows are fixed offsets.</text>

  <text x="24" y="584" font-size="11" fill="#5a6478">† The attribute table sits at +0x4130 with 16-byte records; which register pair carries it is UNRESOLVED.</text>
</svg>
