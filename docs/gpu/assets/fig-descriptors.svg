<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}</style>
<text class="t" x="20" y="24" font-weight="700">Descriptor indirection</text><rect class="b" x="20" y="70" width="170" height="90" rx="4"/><text class="t" x="30" y="90" font-weight="600">Shader-info root</text><text class="m" x="30" y="106">s4:s5 / s6:s7 / s8:s9</text><rect class="b" x="230" y="70" width="180" height="90" rx="4"/><text class="t" x="240" y="90" font-weight="600">Descriptor table</text><text class="m" x="240" y="106">0x40 slots or 16-byte records</text><rect class="b" x="450" y="70" width="180" height="90" rx="4"/><text class="t" x="460" y="90" font-weight="600">Descriptor</text><text class="m" x="460" y="106">buffer / image / sampler</text><rect class="b" x="670" y="70" width="180" height="90" rx="4"/><text class="t" x="680" y="90" font-weight="600">Payload</text><text class="m" x="680" y="106">GPU VA + range + format</text><line class="a" x1="190" y1="115" x2="230" y2="115"/><line class="a" x1="410" y1="115" x2="450" y2="115"/><line class="a" x1="630" y1="115" x2="670" y2="115"/><rect class="b" x="20" y="210" width="300" height="80" rx="4"/><text class="t" x="30" y="230" font-weight="600">Attribute table</text><text class="m" x="30" y="246">16 × 16-byte element records</text><rect class="b" x="360" y="210" width="300" height="80" rx="4"/><text class="t" x="370" y="230" font-weight="600">Image + sampler slot</text><text class="m" x="370" y="246">image 32 B, sampler at +0x30</text><rect class="b" x="700" y="210" width="150" height="80" rx="4"/><text class="t" x="710" y="230" font-weight="600">Push constants</text><text class="m" x="710" y="246">256 B at +0x4000</text><text class="m" x="20" y="320" font-size="11" text-anchor="start">A root points at a table; a table entry points at a descriptor; a descriptor points at payload.</text></svg>
