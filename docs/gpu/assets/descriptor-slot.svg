<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 106" width="440" height="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
<text x="8" y="16" fill="#111">Resource slot (0x40 bytes)</text>
<rect x="8" y="26" width="200" height="44" fill="#dbe9ff" stroke="#444" stroke-width="1" rx="2"/>
<text x="108" y="43" text-anchor="middle" fill="#111">image descriptor</text>
<text x="108" y="58" text-anchor="middle" fill="#555" font-size="10">0x00 .. 0x1f</text>
<rect x="210" y="26" width="90" height="44" fill="#f5f5f5" stroke="#444" stroke-width="1" rx="2"/>
<text x="255" y="43" text-anchor="middle" fill="#111">gap</text>
<text x="255" y="58" text-anchor="middle" fill="#555" font-size="10">0x20 .. 0x2f</text>
<rect x="302" y="26" width="120" height="44" fill="#e8f5e9" stroke="#444" stroke-width="1" rx="2"/>
<text x="362" y="43" text-anchor="middle" fill="#111">sampler descriptor</text>
<text x="362" y="58" text-anchor="middle" fill="#555" font-size="10">0x30 .. 0x3f</text>
<text x="8" y="92" fill="#555" font-size="10">A buffer descriptor is a separate 16-byte record; an attribute table is an array of them.</text>
</svg>
