<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" width="1000" height="536" font-family="DejaVu Sans, ui-sans-serif, system-ui, sans-serif">
<title>Full state record and delta record: layout and next-record cursor</title>
<defs>
  <marker id="acc" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2f5d8a"/></marker>
  <marker id="ink" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#44506a"/></marker>
</defs>
<style>
  .cell{fill:#eef2f8;stroke:#44506a;stroke-width:1.25}
  .tail{fill:none;stroke:#44506a;stroke-width:1.25}
  .val{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:12px;fill:#10141c}
  .role{font-size:11px;fill:#5a6478}
  .body{font-size:12px;fill:#10141c}
  .muted{font-size:11px;fill:#5a6478}
  .sec{font-size:11px;font-weight:700;fill:#10141c}
  .sep{stroke:#44506a;stroke-width:1.25}
  .tick{stroke:#44506a;stroke-width:1.25}
  .brk{fill:none;stroke:#44506a;stroke-width:1.25}
</style>

<text x="24" y="28" font-size="16" font-weight="700" fill="#10141c">Full state record vs delta: where the next batch record starts</text>
<text x="24" y="52" class="body" fill="#5a6478">Both forms open with 0xf04 and close with 0x03; only the full form writes mode 10 and range 0x20000001.</text>

<!-- full form -->
<text x="24" y="80" class="sec">FULL FORM · 516-dword record</text>
<text x="468" y="80" class="muted" text-anchor="middle">512 dwords — the whole block</text>
<text x="852" y="80" class="muted" text-anchor="middle">tail · 12 dwords</text>
<path class="brk" d="M288,88 V96 M288,92 H648 M648,92 V96"/>

<g>
  <rect class="cell" x="24" y="96" width="64" height="48"/>
  <rect class="cell" x="88" y="96" width="64" height="48"/>
  <rect class="cell" x="152" y="96" width="112" height="48"/>
  <rect class="cell" x="288" y="96" width="360" height="48"/>
  <rect class="cell" x="672" y="96" width="80" height="48"/>
  <rect class="tail" x="752" y="96" width="88" height="48"/>
  <rect class="tail" x="840" y="96" width="112" height="48"/>
</g>
<g class="sep">
  <line x1="88" y1="96" x2="88" y2="144"/>
  <line x1="152" y1="96" x2="152" y2="144"/>
  <line x1="648" y1="96" x2="648" y2="144"/>
  <line x1="840" y1="96" x2="840" y2="144"/>
</g>
<g class="brk">
  <path d="M265,104 L273,136"/>
  <path d="M277,104 L285,136"/>
  <path d="M651,104 L659,136"/>
  <path d="M663,104 L671,136"/>
</g>

<text class="val" x="56" y="116" text-anchor="middle">0xf04</text>
<text class="role" x="56" y="134" text-anchor="middle">opcode</text>
<text class="val" x="120" y="116" text-anchor="middle">10</text>
<text class="role" x="120" y="134" text-anchor="middle">mode</text>
<text class="val" x="208" y="116" text-anchor="middle">0x20000001</text>
<text class="role" x="208" y="134" text-anchor="middle">range</text>
<text class="body" x="468" y="124" text-anchor="middle" fill="#5a6478">state[0] … state[511]</text>
<text class="val" x="712" y="116" text-anchor="middle">0x03</text>
<text class="role" x="712" y="134" text-anchor="middle">terminator</text>
<text class="val" x="796" y="116" text-anchor="middle">0xf05</text>
<text class="role" x="796" y="134" text-anchor="middle">end command</text>
<text class="val" x="896" y="116" text-anchor="middle">11 zeros</text>
<text class="role" x="896" y="134" text-anchor="middle">pad</text>

<g class="tick">
  <line x1="24" y1="144" x2="24" y2="148"/>
  <line x1="88" y1="144" x2="88" y2="148"/>
  <line x1="152" y1="144" x2="152" y2="148"/>
  <line x1="288" y1="144" x2="288" y2="148"/>
  <line x1="672" y1="144" x2="672" y2="148"/>
  <line x1="752" y1="144" x2="752" y2="148"/>
  <line x1="840" y1="144" x2="840" y2="148"/>
  <line x1="952" y1="144" x2="952" y2="148"/>
</g>
<g class="muted">
  <text x="24" y="164">0</text>
  <text x="88" y="164" text-anchor="middle">1</text>
  <text x="152" y="164" text-anchor="middle">2</text>
  <text x="288" y="164" text-anchor="middle">3</text>
  <text x="672" y="164" text-anchor="middle">515</text>
  <text x="752" y="164" text-anchor="middle">516</text>
  <text x="840" y="164" text-anchor="middle">517</text>
  <text x="952" y="164" text-anchor="end">528</text>
</g>

<text x="388" y="180" class="muted" text-anchor="middle">cursor advances 516 dwords</text>
<line x1="24" y1="188" x2="752" y2="188" stroke="#2f5d8a" stroke-width="1.25" marker-end="url(#acc)"/>
<text x="764" y="204" class="muted">next 0xf04 lands here,</text>
<text x="764" y="220" class="muted">over the 0xf05</text>

<!-- delta form -->
<text x="24" y="248" class="sec">DELTA FORM · 3 + L dwords</text>
<text x="760" y="252" class="muted">more windows: descriptor + data</text>
<text x="760" y="268" class="muted">over 516 dwords: sent as full</text>
<text x="760" y="284" class="muted">a delta never opens a buffer</text>

<text x="644" y="280" class="muted" text-anchor="middle">same 12-dword tail</text>

<g>
  <rect class="cell" x="24" y="296" width="64" height="48"/>
  <rect class="cell" x="88" y="296" width="160" height="48"/>
  <rect class="cell" x="248" y="296" width="224" height="48"/>
  <rect class="cell" x="472" y="296" width="80" height="48"/>
  <rect class="tail" x="552" y="296" width="88" height="48"/>
  <rect class="tail" x="640" y="296" width="96" height="48"/>
</g>
<g class="sep">
  <line x1="88" y1="296" x2="88" y2="344"/>
  <line x1="248" y1="296" x2="248" y2="344"/>
  <line x1="472" y1="296" x2="472" y2="344"/>
  <line x1="640" y1="296" x2="640" y2="344"/>
</g>

<text class="val" x="56" y="316" text-anchor="middle">0xf04</text>
<text class="role" x="56" y="334" text-anchor="middle">opcode</text>
<text class="body" x="168" y="324" text-anchor="middle">window descriptor</text>
<text class="val" x="360" y="316" text-anchor="middle">L dwords</text>
<text class="role" x="360" y="334" text-anchor="middle">one per changed state dword</text>
<text class="val" x="512" y="316" text-anchor="middle">0x03</text>
<text class="role" x="512" y="334" text-anchor="middle">terminator</text>
<text class="val" x="596" y="316" text-anchor="middle">0xf05</text>
<text class="role" x="596" y="334" text-anchor="middle">end command</text>
<text class="val" x="688" y="316" text-anchor="middle">11 zeros</text>
<text class="role" x="688" y="334" text-anchor="middle">pad</text>

<g class="tick">
  <line x1="24" y1="344" x2="24" y2="348"/>
  <line x1="88" y1="344" x2="88" y2="348"/>
  <line x1="248" y1="344" x2="248" y2="348"/>
  <line x1="472" y1="344" x2="472" y2="348"/>
  <line x1="552" y1="344" x2="552" y2="348"/>
  <line x1="640" y1="344" x2="640" y2="348"/>
  <line x1="736" y1="344" x2="736" y2="348"/>
</g>
<g class="muted">
  <text x="24" y="364">0</text>
  <text x="88" y="364" text-anchor="middle">1</text>
  <text x="248" y="364" text-anchor="middle">2</text>
  <text x="472" y="364" text-anchor="middle">2 + L</text>
  <text x="552" y="364" text-anchor="middle">3 + L</text>
</g>
<text x="88" y="388" class="muted">descriptor bits: opcode 1 [7:0] · start [19:8] · length [31:20]</text>

<text x="288" y="412" class="muted" text-anchor="middle">cursor advances 3 + L dwords</text>
<line x1="24" y1="420" x2="552" y2="420" stroke="#44506a" stroke-width="1.25" marker-end="url(#ink)"/>
<text x="564" y="436" class="muted">next record starts here</text>

<text x="24" y="468" class="muted">Submitted length covers the 12-dword tail past the cursor: 0xf05 and eleven zeros.</text>
<text x="24" y="486" class="muted">Cell widths are schematic; dword offsets are exact.</text>
</svg>
