<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif" font-size="12">
<defs>
  <marker id="ah" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0L6 3L0 6z" fill="#10141c"/>
  </marker>
  <marker id="aha" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto">
    <path d="M0 0L6 3L0 6z" fill="#2f5d8a"/>
  </marker>
</defs>
<style>
  .h{fill:#10141c;font-weight:600}
  .t{fill:#10141c}
  .m{fill:#5a6478}
  .f{fill:none;stroke:#44506a;stroke-width:1.25}
  .p{fill:#eef2f8;stroke:#44506a;stroke-width:1.25}
  .d{fill:none;stroke:#44506a;stroke-width:1.25;stroke-dasharray:4 4}
  .dd{fill:none;stroke:#5a6478;stroke-width:1;stroke-dasharray:3 3}
  .ar{stroke:#10141c;stroke-width:1.25;fill:none;marker-end:url(#ah)}
  .aa{stroke:#2f5d8a;stroke-width:1.25;fill:none;marker-end:url(#aha)}
  .br{stroke:#44506a;stroke-width:1;fill:none}
  .dv{stroke:#44506a;stroke-width:1.25}
</style>
<rect width="1000" height="640" fill="#ffffff"/>

<text x="24" y="28" font-size="16" font-weight="700" fill="#10141c">One submission: chunk list, ring packet, indirect buffer, state record</text>
<text x="24" y="48" font-size="11" class="m">Widths are schematic; every count and dword position is the emitter's own value.</text>

<!-- ================= band A: submission ================= -->
<rect class="f" x="24" y="60" width="952" height="104"/>
<text x="36" y="82" class="h">SUBMISSION &#8212; one CS ioctl, a chunk array</text>
<text x="960" y="82" font-size="11" class="m" text-anchor="end">ends at num_chunks entries</text>

<rect class="p" x="36" y="90" width="152" height="48"/>
<text x="46" y="108" class="t">IB chunk</text>
<text x="46" y="126" font-size="11" class="m">&#8594; packet 0</text>

<rect class="p" x="196" y="90" width="152" height="48"/>
<text x="206" y="108" class="t">IB chunk</text>
<text x="206" y="126" font-size="11" class="m">&#8594; packet 1</text>

<rect class="dd" x="356" y="90" width="48" height="48"/>
<text x="380" y="120" font-size="12" class="m" text-anchor="middle">&#8230;</text>

<rect class="p" x="412" y="90" width="152" height="48"/>
<text x="422" y="108" class="t">FENCE chunk</text>
<text x="422" y="126" font-size="11" class="m">id 0x02 &#183; 2 dw</text>

<rect class="dd" x="572" y="90" width="164" height="48"/>
<text x="582" y="108" font-size="11" class="m">wait / signal</text>
<text x="582" y="126" font-size="11" class="m">optional</text>

<text x="752" y="102" font-size="11" class="m">an IB chunk names a buffer:</text>
<text x="752" y="120" font-size="11" class="m">va_start + ib_bytes &#8212; never</text>
<text x="752" y="138" font-size="11" class="m">the buffer's bytes</text>

<text x="36" y="152" font-size="11" class="m">IB chunk payload: 8 dwords &#8212; pad, flags, va_start (2), ib_bytes, ip_type, ip_instance, ring</text>

<!-- arrow: submission -> ring emission -->
<path class="ar" d="M112 164V192"/>
<text x="124" y="184" font-size="11" class="t">emitted per IB chunk</text>

<!-- ================= band B: ring packet ================= -->
<rect class="f" x="24" y="196" width="952" height="98"/>
<text x="36" y="218" class="h">GFX RING &#8212; kernel-owned buffer, one 5-dword packet per buffer</text>
<text x="960" y="218" font-size="11" class="m" text-anchor="end">ends after dword 4</text>

<rect class="dd" x="36" y="238" width="44" height="32"/>
<text x="58" y="258" font-size="12" class="m" text-anchor="middle">&#8230;</text>

<rect class="p" x="88" y="226" width="120" height="56"/>
<text x="98" y="250" class="t">0x0f | vmid&lt;&lt;8</text>
<text x="98" y="268" font-size="11" class="m">vmid packet</text>

<rect class="p" x="208" y="226" width="104" height="56"/>
<text x="218" y="250" class="t">0x80</text>
<text x="218" y="268" font-size="11" class="m">IB packet</text>

<rect class="p" x="312" y="226" width="176" height="56"/>
<text x="322" y="250" class="t">va_start[31:0]</text>
<text x="322" y="268" font-size="11" class="m">address low</text>

<rect class="p" x="488" y="226" width="176" height="56"/>
<text x="498" y="250" class="t">va_start[63:32]</text>
<text x="498" y="268" font-size="11" class="m">address high</text>

<rect class="p" x="664" y="226" width="224" height="56"/>
<line class="dv" x1="832" y1="226" x2="832" y2="282"/>
<text x="674" y="250" class="t">length_dw[23:0]</text>
<text x="674" y="268" font-size="11" class="m">dword count</text>
<text x="860" y="250" class="t" text-anchor="middle">vmid</text>
<text x="860" y="268" font-size="11" class="m" text-anchor="middle">31:24</text>

<rect class="dd" x="896" y="238" width="64" height="32"/>
<text x="928" y="258" font-size="12" class="m" text-anchor="middle">&#8230;</text>

<!-- accent: packet names the buffer -->
<path class="aa" d="M600 294V358"/>
<text x="612" y="318" font-size="11" class="t">dwords 2&#8211;4 name the buffer below:</text>
<text x="612" y="338" font-size="11" class="m">address + dword count; the bytes stay in client memory</text>

<!-- ================= band C: indirect buffer ================= -->
<rect class="f" x="24" y="364" width="952" height="240"/>
<text x="36" y="386" class="h">INDIRECT BUFFER &#8212; client memory, addressed by the packet</text>
<text x="960" y="386" font-size="11" class="m" text-anchor="end">one full block: ib_bytes = 528 dw = 2112 B</text>

<rect class="d" x="36" y="396" width="128" height="156"/>
<text x="100" y="444" font-size="11" class="m" text-anchor="middle">6 dwords</text>
<text x="100" y="466" font-size="11" class="m" text-anchor="middle">border-table</text>
<text x="100" y="488" font-size="11" class="m" text-anchor="middle">preamble</text>
<text x="100" y="518" font-size="11" class="m" text-anchor="middle">first block only</text>

<rect class="f" x="172" y="396" width="396" height="156"/>
<text x="184" y="414" class="h">STATE RECORD</text>
<text x="300" y="414" font-size="11" class="m">full form &#183; header 3 dw, state 512 dw</text>

<rect class="p" x="184" y="418" width="92" height="40"/>
<text x="194" y="435" class="t">0xf04</text>
<text x="194" y="452" font-size="11" class="m">opcode</text>

<rect class="p" x="284" y="418" width="68" height="40"/>
<text x="294" y="435" class="t">10</text>
<text x="294" y="452" font-size="11" class="m">mode</text>

<rect class="p" x="360" y="418" width="196" height="40"/>
<text x="370" y="435" class="t">0x20000001</text>
<text x="370" y="452" font-size="11" class="m">win 1, start 0, len 512</text>

<rect class="f" x="184" y="464" width="372" height="52"/>
<rect class="p" x="190" y="470" width="132" height="40"/>
<text x="200" y="489" font-size="11" font-weight="600" class="t">Draw Info</text>
<text x="200" y="505" font-size="11" class="m">36 B &#183; 9 dw</text>
<text x="334" y="489" font-size="11" class="m">count, instances, prim type</text>
<text x="334" y="505" font-size="11" class="m">other state: dwords 9&#8211;511</text>

<rect class="p" x="184" y="522" width="132" height="22"/>
<text x="194" y="538" class="t">0x03</text>
<text x="230" y="538" font-size="11" class="m">terminator</text>
<text x="330" y="538" font-size="11" class="m">record ends; the buffer continues</text>

<rect class="d" x="576" y="396" width="148" height="156"/>
<text x="588" y="414" font-size="11" font-weight="600" class="t">STATE RECORD</text>
<text x="712" y="414" font-size="11" class="m" text-anchor="end">delta</text>
<rect class="p" x="588" y="418" width="60" height="40"/>
<text x="596" y="443" class="t">0xf04</text>
<rect class="d" x="588" y="464" width="124" height="52"/>
<text x="596" y="486" font-size="11" class="m">window writes</text>
<text x="596" y="504" font-size="11" class="m">changed dwords</text>
<rect class="p" x="588" y="522" width="60" height="22"/>
<text x="596" y="538" class="t">0x03</text>

<text x="744" y="452" font-size="11" class="m">the cursor advances 516 dwords,</text>
<text x="744" y="470" font-size="11" class="m">so 0xf04 overwrites 0xf05.</text>

<rect class="p" x="732" y="522" width="76" height="22"/>
<text x="742" y="538" class="t">0xf05</text>

<rect class="p" x="816" y="522" width="144" height="22"/>
<text x="826" y="538" font-size="11" class="m">11 pad dwords</text>

<path class="br" d="M172 560V566M172 563H568M568 560V566"/>
<text x="370" y="582" font-size="11" class="m" text-anchor="middle">516 dw</text>
<path class="br" d="M576 560V566M576 563H724M724 560V566"/>
<text x="650" y="582" font-size="11" class="m" text-anchor="middle">4&#8230;516 dw</text>
<path class="br" d="M732 560V566M732 563H960M960 560V566"/>
<text x="846" y="582" font-size="11" class="m" text-anchor="middle">end command + 11 pad = 12 dw</text>
</svg>