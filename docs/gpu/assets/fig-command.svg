<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.t{fill:#10141c}.m{fill:#5a6478}.a{stroke:#44506a;stroke-width:1.4;fill:none;marker-end:url(#a)}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}</style>
<text class="t" x="20" y="24" font-weight="700">Command nesting</text><rect class="d" x="20" y="50" width="820" height="290" rx="4"/><text class="t" x="30" y="70" font-weight="600">CS ioctl</text><text class="m" x="30" y="86">chunks: IB, fence, dependencies, residency</text><rect class="d" x="45" y="80" width="360" height="230" rx="4"/><text class="t" x="55" y="100" font-weight="600">Ring packet</text><text class="m" x="55" y="116">VMID + IB + writeback</text><rect class="d" x="70" y="110" width="310" height="170" rx="4"/><text class="t" x="80" y="130" font-weight="600">Indirect buffer</text><text class="m" x="80" y="146">GPU VA + length; executable</text><rect class="d" x="95" y="140" width="260" height="110" rx="4"/><text class="t" x="105" y="160" font-weight="600">State record</text><text class="m" x="105" y="176">0xf04 + windows + 0x03</text><rect class="b" x="120" y="170" width="120" height="55" rx="4"/><text class="t" x="130" y="190" font-weight="600">State object</text><text class="m" x="130" y="206">512 dwords</text><rect class="b" x="255" y="170" width="80" height="55" rx="4"/><text class="t" x="265" y="190" font-weight="600">Draw</text><text class="m" x="265" y="206">BPIPE</text><text class="m" x="400" y="110" font-size="10" text-anchor="start">Each layer adds framing and a length. The point is the containment, not the packet order.</text><text class="m" x="20" y="360" font-size="11" text-anchor="start">A submission names one ring; the IB is the payload the ring executes.</text></svg>
