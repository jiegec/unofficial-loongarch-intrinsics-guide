<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#44506a"/></marker></defs>
<style>.t{fill:#10141c}.m{fill:#5a6478}.b{fill:#eef2f8;stroke:#44506a;stroke-width:1.2}.d{fill:#fff;stroke:#44506a;stroke-width:1.1}</style>
<text class="t" x="20" y="24" font-weight="700">Command nesting</text>
<rect class="b" x="20" y="45" width="820" height="310" rx="4"/><text class="t" x="32" y="68" font-weight="600">CS ioctl</text><text class="m" x="110" y="68">chunks: IB, fence, dependencies, residency</text>
<rect class="b" x="45" y="90" width="770" height="245" rx="4"/><text class="t" x="57" y="113" font-weight="600">Ring packet</text><text class="m" x="150" y="113">VMID + IB + writeback</text>
<rect class="b" x="70" y="135" width="720" height="180" rx="4"/><text class="t" x="82" y="158" font-weight="600">Indirect buffer</text><text class="m" x="185" y="158">GPU virtual address and length; executable</text>
<rect class="b" x="95" y="180" width="670" height="115" rx="4"/><text class="t" x="107" y="203" font-weight="600">State record</text><text class="m" x="205" y="203">0xf04 + windows + 0x03</text>
<rect class="d" x="120" y="220" width="150" height="50" rx="4"/><text class="t" x="130" y="240" font-weight="600">State object</text><text class="m" x="130" y="256">512 dwords</text>
<rect class="d" x="295" y="220" width="120" height="50" rx="4"/><text class="t" x="305" y="240" font-weight="600">Draw</text><text class="m" x="305" y="256">BPIPE</text>
<text class="m" x="20" y="382">A submission names one ring; the indirect buffer is the payload the ring executes.</text>
</svg>