site_name: Unofficial LoongArch Intrinsics Guide
site_url: https://jia.je/unofficial-loongarch-intrinsics-guide
site_description: Unofficial LoongArch Intrinsics Guide
theme:
  name: readthedocs
copyright: Copyright &copy; 2023-2026 Jiajie Chen
plugins:
  # we use our own search
  # - search:
  #     separator: '[\s\-\._]+' # add "_" and "."
  - macros:
      include_dir: code
  - glightbox
  - llmstxt:
      link: /unofficial-loongarch-intrinsics-guide/llms.txt
      sections:
        Unofficial LoongArch Intrinsics Guide:
        - "*.md"

extra_css:
  - main.css

