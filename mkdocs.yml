site_name: Unofficial LoongArch Intrinsics Guide
site_url: https://jia.je/unofficial-loongarch-intrinsics-guide
site_description: Unofficial LoongArch Intrinsics Guide
theme:
  name: readthedocs
copyright: Copyright &copy; 2023-2026 Jiajie Chen
plugins:
  # we use our own search
  # - search:
  #     separator: '[\s\-\._]+' # add "_" and "."
  - macros:
      include_dir: code
  - glightbox
  - llmstxt:
      link: /unofficial-loongarch-intrinsics-guide/llms.txt
      sections:
        Unofficial LoongArch Intrinsics Guide:
        - "*.md"

hooks:
  # generate docs/intrinsic/*.md (one page per intrinsic) before building
  - tools/gen_intrinsic_pages_hook.py

extra_css:
  - main.css

# one page per intrinsic, reachable from intrinsic/index.md and search,
# but not repeated in the sidebar of every page
not_in_nav: |
  /intrinsic/*
  !/intrinsic/index.md
